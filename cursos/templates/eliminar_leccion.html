<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar lección</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            border-top: 6px solid #dc2626;
            text-align: center;
        }

        h1 {
            color: #b91c1c;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #475569;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        strong {
            color: #1e293b;
        }

        .button-container {
            display: flex;
            gap: 12px;
        }

        button,
        .btn-secundario {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: #dc2626;
            color: white;
        }

        button:hover {
            background: #b91c1c;
        }

        .btn-secundario {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secundario:hover {
            background: #e2e8f0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Confirmar Eliminación</h1>
        <p>
            ¿Está seguro de que desea eliminar permanentemente la lección
            <strong>"{{ leccion.titulo }}"</strong> del curso
            <strong>{{ leccion.curso.titulo }}</strong>?
            Esta acción no se puede deshacer.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="button-container">
                <a href="{% url 'detalle_curso' leccion.curso.pk %}" class="btn-secundario">Cancelar</a>
                <button type="submit">Confirmar Eliminación</button>
            </div>
        </form>
    </div>

</body>
</html>
