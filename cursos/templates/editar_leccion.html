<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar lección</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 15px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
        }

        .button-container {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        button,
        .btn-secundario {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .btn-secundario {
            background: #f1f5f9;
            color: #475569;
        }

        .btn-secundario:hover {
            background: #e2e8f0;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Editar lección</h1>
            <p>Curso: {{ leccion.curso.titulo }}</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="titulo">Título de la lección</label>
                <input
                    type="text"
                    name="titulo"
                    id="titulo"
                    value="{{ titulo }}"
                >
                {% if error and not titulo %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="contenido">Contenido</label>
                <textarea
                    name="contenido"
                    id="contenido"
                    rows="4"
                >{{ contenido }}</textarea>
                {% if error and not contenido %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="duracion">Duración en minutos</label>
                <input
                    type="number"
                    name="duracion"
                    id="duracion"
                    step="1"
                    min="1"
                    value="{{ duracion }}"
                >
                {% if error and not duracion %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="estado">Estado</label>
                <select name="estado" id="estado">
                    <option value="Borrador" {% if estado == "Borrador" %}selected{% endif %}>Borrador</option>
                    <option value="Publicado" {% if estado == "Publicado" %}selected{% endif %}>Publicado</option>
                </select>
            </div>

            <div class="button-container">
                <a href="{% url 'detalle_curso' leccion.curso.pk %}" class="btn-secundario">Cancelar</a>
                <button type="submit">Guardar Cambios</button>
            </div>

        </form>

    </div>

</body>
</html>
